<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kent Yang</title>
  <meta name="description" content="Kent Yang — Product Designer based in Tokyo.">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;600&display=swap">
  <style>
    :root {
      --bg: #fefefe;
      --text: #121212;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --text: #afafaf;
      }
    }
    html {
      font-family: "IBM Plex Sans", sans-serif;
      font-weight: 300;
      color: var(--text);
      background: var(--bg);
    }
    body {
      margin: 0 auto;
      max-width: 960px;
      padding: 0 1.0875rem 1.45rem;
    }
    img {
      display: block;
      width: 100%;
      max-width: 300px;
      height: auto;
      margin-bottom: 1.45rem;
      mix-blend-mode: multiply;
    }
    @media (prefers-color-scheme: dark) {
      img {
        filter: invert(1);
        mix-blend-mode: screen;
      }
    }
    p {
      line-height: 1.6em;
    }
    .name {
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <img src="profile.webp" alt="Kent Yang" width="2000" height="2000">
    <p class="name">Kent Yang</p>
    <p>Product Designer based in Tokyo.<br>I recognize design as a method, a process, and a journey to build relationships.</p>
  </main>
</body>
</html>
